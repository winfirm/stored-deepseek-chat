<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>DeepSeek Chat</title>
<meta name="description" content="用自己的 DeepSeek API 聊天，对话自动保存到 GitHub 仓库" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="brand">DeepSeek Chat</div>
      <button class="icon-btn sb-collapse" id="btnCollapse" aria-label="收起侧边栏">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>

    <button class="new-chat" id="btnNew">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建对话
    </button>

    <div class="sb-search">
      <input id="searchInput" type="search" placeholder="搜索对话" />
    </div>

    <div class="sb-list" id="drawerList"></div>

    <div class="sb-foot">
      <div class="repo-label" id="repoLabel">未配置 GitHub</div>
      <button class="sb-item" id="btnSettings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a2 2 0 1 1 0 4H19.4a1.7 1.7 0 0 0-1.56 1Z"/></svg>
        设置
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="main-head" id="mainHead">
      <button class="icon-btn only-mobile" id="btnMenu" aria-label="对话记录">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button class="icon-btn sb-expand" id="btnExpand" aria-label="展开侧边栏">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <div class="head-title">
        <span id="chatTitle">DeepSeek Chat</span>
        <span id="saveState" class="save-state" data-s=""></span>
      </div>
      <button class="icon-btn only-mobile" id="btnNewMobile" aria-label="新建对话">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <div class="chat" id="chat"></div>

    <div class="composer" id="composer">
      <div class="composer-inner">
        <div class="input-card">
          <textarea id="input" rows="1" placeholder="给 DeepSeek 发送消息" enterkeyhint="send"></textarea>
          <div class="card-row">
            <div class="toggles">
              <button class="toggle" id="btnThink" type="button" title="使用 DeepSeek-R1 深度思考">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5 12.6 8 17 9.6 12.6 11.2 11 15.7 9.4 11.2 5 9.6 9.4 8 11 3.5Z"/><path d="M17.8 15.2l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2Z"/></svg>
                DeepThink
              </button>
              <button class="toggle" id="btnSearch" type="button" title="联网搜索后再回答">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
                Search
              </button>
            </div>
            <button class="send-btn" id="btnSend" aria-label="发送">
              <svg class="ic-send" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              <svg class="ic-stop" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-hint">内容由 AI 生成，请仔细甄别</div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="settingsModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h2 id="settingsTitle">设置</h2>
        <p class="modal-sub" id="settingsSub">对话自动保存到你的 GitHub 仓库</p>
      </div>
      <button class="icon-btn" id="btnCloseSettings" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <section class="form-section">
        <h3>DeepSeek</h3>
        <label class="field">
          <span>API Key</span>
          <input id="setApiKey" type="password" autocomplete="off" placeholder="sk-..." />
        </label>
        <label class="field">
          <span>API 地址</span>
          <input id="setApiBase" type="url" placeholder="https://api.deepseek.com" />
        </label>
      </section>

      <section class="form-section">
        <h3>GitHub 存储</h3>
        <p class="section-note">需要一个有该仓库 Contents 读写权限的 Token。对话会以 JSON 文件保存在仓库目录中。</p>
        <label class="field">
          <span>Personal Access Token</span>
          <input id="setGhToken" type="password" autocomplete="off" placeholder="github_pat_... 或 ghp_..." />
        </label>
        <div class="field-row">
          <label class="field">
            <span>用户名 / 组织</span>
            <input id="setGhOwner" type="text" placeholder="octocat" />
          </label>
          <label class="field">
            <span>仓库</span>
            <input id="setGhRepo" type="text" placeholder="my-chats" />
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span>分支</span>
            <input id="setGhBranch" type="text" placeholder="main" />
          </label>
          <label class="field">
            <span>目录</span>
            <input id="setGhDir" type="text" placeholder="chats" />
          </label>
        </div>
      </section>

      <section class="form-section">
        <h3>外观</h3>
        <label class="field">
          <span>主题</span>
          <select id="setTheme">
            <option value="auto">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
      </section>
    </div>
    <div class="modal-foot">
      <p class="footnote">Key 与 Token 只保存在本机浏览器 localStorage，请求直接从浏览器发往 DeepSeek 与 GitHub，不经过任何第三方服务器。</p>
      <div class="modal-actions">
        <button class="ghost-btn" id="btnTest">测试连接</button>
        <button class="primary-btn" id="btnSaveSettings">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="app.js"></script>
</body>
</html>
