<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1b1c1d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>DeepSeek Chat</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="description" content="用自己的 DeepSeek API 聊天，对话自动保存到 GitHub 仓库" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="btnMenu" aria-label="对话记录">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="topbar-title">
      <span id="chatTitle">DeepSeek Chat</span>
      <span id="saveState" class="save-state" title="保存状态"></span>
    </div>
    <button class="icon-btn" id="btnNew" aria-label="新建对话">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="icon-btn" id="btnSettingsTop" aria-label="设置">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a2 2 0 1 1 0 4H19.4a1.7 1.7 0 0 0-1.56 1Z"/></svg>
    </button>
  </header>

  <main class="chat" id="chat"></main>

  <div class="composer" id="composer">
    <div class="composer-inner">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="给 DeepSeek 发送消息" enterkeyhint="send"></textarea>
        <button class="send-btn" id="btnSend" aria-label="发送">
          <svg class="ic-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <svg class="ic-stop" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </button>
      </div>
      <div class="composer-meta">
        <select id="modelSelect" class="model-select" aria-label="模型">
          <option value="deepseek-flash">DeepSeek-Flash</option>
          <option value="deepseek-chat">DeepSeek-V3</option>
          <option value="deepseek-reasoner">DeepSeek-R1</option>
        </select>
        <span class="composer-hint">内容由 AI 生成，请仔细甄别</span>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-title">对话记录</div>
      <div class="drawer-sub" id="repoLabel">未配置 GitHub</div>
    </div>
    <button class="icon-btn" id="btnRefresh" aria-label="刷新列表">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
    </button>
  </div>
  <div class="drawer-search">
    <input id="searchInput" type="search" placeholder="搜索标题" />
  </div>
  <div class="drawer-list" id="drawerList"></div>
  <div class="drawer-foot">
    <button class="ghost-btn" id="btnNew2">+ 新建对话</button>
    <button class="ghost-btn" id="btnSettings">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a1.7 1.7 0 0 0-1.6-1H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 3 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 3a1.7 1.7 0 0 0 1-1.6V1a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15 3a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 9v.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      设置
    </button>
  </div>
</aside>

<div class="modal" id="settingsModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h2 id="settingsTitle">设置</h2>
        <p class="modal-sub" id="settingsSub">对话自动保存到你的 GitHub 仓库</p>
      </div>
      <button class="icon-btn" id="btnCloseSettings" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <section class="form-section">
        <h3>DeepSeek</h3>
        <label class="field">
          <span>API Key</span>
          <input id="setApiKey" type="password" autocomplete="off" placeholder="sk-..." />
        </label>
        <label class="field">
          <span>API 地址</span>
          <input id="setApiBase" type="url" placeholder="https://api.deepseek.com" />
        </label>
        <label class="field">
          <span>默认模型</span>
          <select id="setModel">
            <option value="deepseek-flash">deepseek-flash</option>
            <option value="deepseek-chat">deepseek-chat</option>
            <option value="deepseek-reasoner">deepseek-reasoner</option>
          </select>
        </label>
      </section>

      <section class="form-section">
        <h3>GitHub 存储</h3>
        <p class="section-note">需要一个有该仓库 Contents 读写权限的 Token。对话会以 JSON 文件保存在仓库目录中。</p>
        <label class="field">
          <span>Personal Access Token</span>
          <input id="setGhToken" type="password" autocomplete="off" placeholder="github_pat_... 或 ghp_..." />
        </label>
        <div class="field-row">
          <label class="field">
            <span>用户名 / 组织</span>
            <input id="setGhOwner" type="text" placeholder="octocat" />
          </label>
          <label class="field">
            <span>仓库</span>
            <input id="setGhRepo" type="text" placeholder="my-chats" />
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span>分支</span>
            <input id="setGhBranch" type="text" placeholder="main" />
          </label>
          <label class="field">
            <span>目录</span>
            <input id="setGhDir" type="text" placeholder="chats" />
          </label>
        </div>
      </section>

      <section class="form-section">
        <h3>外观</h3>
        <label class="field">
          <span>主题</span>
          <select id="setTheme">
            <option value="auto">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
      </section>

    </div>
    <div class="modal-foot">
      <p class="footnote">Key 与 Token 只保存在本机浏览器 localStorage，请求直接从浏览器发往 DeepSeek / GitHub，不经过任何第三方服务器。</p>
      <div class="modal-actions">
        <button class="ghost-btn" id="btnTest">测试连接</button>
        <button class="primary-btn" id="btnSaveSettings">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="app.js"></script>
</body>
</html>
